name: pypi

# Publish each installable addon to PyPI as odoo-addon-<name>. whool
# derives the wheel version from the manifest version, plus the number of
# commits to the addon since that version was set, so every merge that
# changes an addon publishes a new version.

on:
  push:
    branches:
      - "20.0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'GetFluvo'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # whool counts the commits since the manifest version was set
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build manifestoo twine
      - name: Build wheels
        run: |
          mkdir -p dist
          empty_dir=$(mktemp -d)
          for addon in $(manifestoo --select-addons-dir . list); do
            # build from an empty directory, so that the addon's python files
            # are not imported by the build
            (cd "$empty_dir" && python -P -m build --wheel --outdir "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/$addon")
          done
      - name: Check wheels
        run: twine check --strict dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      # trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # without this secret, trusted publishing is used
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
